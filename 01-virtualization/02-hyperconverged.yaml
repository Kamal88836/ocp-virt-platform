apiVersion: hco.kubevirt.io/v1beta1
kind: HyperConverged
metadata:
  name: kubevirt-hyperconverged
  namespace: openshift-cnv
  annotations:
    deployOVS: "false"
spec:
  # --- Node placement: run virt components only on virtualization nodes
  infra:
    nodePlacement:
      nodeSelector:
        node-role.kubernetes.io/virtualization: ""
  workloads:
    nodePlacement:
      nodeSelector:
        node-role.kubernetes.io/virtualization: ""
  # --- Live migration limits (tune to network capacity)
  liveMigrationConfig:
    parallelMigrationsPerCluster: 5
    parallelOutboundMigrationsPerNode: 2
    bandwidthPerMigration: 1Gi          # per-migration cap; omit for unlimited
    completionTimeoutPerGiB: 800
    progressTimeout: 150
    allowAutoConverge: true
    allowPostCopy: false
    # network: migration-net               # NAD in openshift-cnv for a dedicated migration VLAN
  # --- VM behaviour on node drain / upgrade
  evictionStrategy: LiveMigrate
  workloadUpdateStrategy:
    workloadUpdateMethods:
      - LiveMigrate
    batchEvictionSize: 10
    batchEvictionInterval: "1m0s"
  # --- Boot images & features
  featureGates:
    enableCommonBootImageImport: true
    deployTektonTaskResources: false
    downwardMetrics: false
    disableMDevConfiguration: false
    persistentReservation: false
  # --- Resource policy
  resourceRequirements:
    vmiCPUAllocationRatio: 10           # vCPU overcommit ratio (1 = none). Set per client policy.
  # higherWorkloadDensity:
  #   memoryOvercommitPercentage: 150    # enable only after capacity sign-off
  certConfig:
    ca:
      duration: 48h0m0s
      renewBefore: 24h0m0s
    server:
      duration: 24h0m0s
      renewBefore: 12h0m0s
  # --- Default VM eviction/upgrade safety
  uninstallStrategy: BlockUninstallIfWorkloadsExist
