apiVersion: forklift.konveyor.io/v1beta1
kind: Plan
metadata:
  name: wave0-cold
  namespace: openshift-mtv
spec:
  description: "Wave 0 – non-prod app servers (CAB CHG0012345)"
  provider:
    source:      { name: vsphere-prod, namespace: openshift-mtv }
    destination: { name: host,         namespace: openshift-mtv }
  map:
    network: { name: netmap-wave0,  namespace: openshift-mtv }
    storage: { name: stormap-wave0, namespace: openshift-mtv }
  targetNamespace: vm-pilot
  warm: false
  archived: false
  preserveStaticIPs: true                 # Windows static IP preservation
  preserveClusterCPUModel: false
  targetPowerState: "on"                  # on | off | auto (auto = mirror source)
  migrateSharedDisks: true
  skipGuestConversion: false              # keep false unless VM already has virtio drivers
  # enableNestedVirtualization: false     # set false to disable VBS-driven nested virt on Windows targets
  transferNetwork:                        # importer pods attach here for ESXi disk reads
    name: migration-transfer
    namespace: openshift-mtv
  pvcNameTemplate: "{{.VmName}}-disk-{{.DiskIndex}}"
  vms:
    - id: vm-1234
      name: app01                         # target VM name (must be RFC1123 compliant)
    - id: vm-1235
      name: app02
    - id: vm-1301
      name: winapp01
      # Optional per-VM hooks (Ansible playbook image or custom image)
      # hooks:
      #   - step: PreHook
      #     hook: { name: pre-shutdown-notice, namespace: openshift-mtv }
