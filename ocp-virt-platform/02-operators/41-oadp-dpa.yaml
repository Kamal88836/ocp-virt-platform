apiVersion: oadp.openshift.io/v1alpha1
kind: DataProtectionApplication
metadata:
  name: dpa-virt
  namespace: openshift-adp
spec:
  configuration:
    velero:
      defaultPlugins: [openshift, aws, kubevirt, csi]
      featureFlags: [EnableCSI]
    nodeAgent:
      enable: true
      uploaderType: kopia
  backupLocations:
    - velero:
        provider: aws
        default: true
        objectStorage: { bucket: <bucket>, prefix: ocp-virt }
        config:
          region: <region>
          s3ForcePathStyle: "true"
          s3Url: https://<s3-endpoint>
        credential: { name: cloud-credentials, key: cloud }
  snapshotLocations: []
