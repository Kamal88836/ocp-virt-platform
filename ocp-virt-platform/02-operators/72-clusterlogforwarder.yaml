apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: collector
  namespace: openshift-logging
spec:
  managementState: Managed
  serviceAccount:
    name: collector
  collector:
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { memory: 2Gi }
  outputs:
    - name: default-lokistack
      type: lokiStack
      lokiStack:
        target:
          name: logging-loki
          namespace: openshift-logging
        authentication:
          token:
            from: serviceAccount
      tls:
        ca:
          key: service-ca.crt
          configMapName: openshift-service-ca.crt
    - name: siem-syslog
      type: syslog
      syslog:
        url: tls://siem.<domain>:6514
        rfc: RFC5424
        facility: local0
        severity: informational
        appName: openshift-<cluster>
      tls:
        ca:
          key: ca-bundle.crt
          secretName: siem-ca                      # oc create secret generic siem-ca --from-file=ca-bundle.crt
  filters:
    - name: drop-noisy-infra
      type: drop
      drop:
        - test:
            - field: .kubernetes.namespace_name
              matches: "^openshift-(kube-apiserver-operator|marketplace)$"
  pipelines:
    - name: all-to-loki
      inputRefs: [application, infrastructure, audit]
      outputRefs: [default-lokistack]
      filterRefs: [drop-noisy-infra]
    - name: audit-to-siem
      inputRefs: [audit]
      outputRefs: [siem-syslog]
