apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
data:
  config.yaml: |
    enableUserWorkload: true
    prometheusK8s:
      retention: 15d
      retentionSize: 90GB
      volumeClaimTemplate:
        spec:
          storageClassName: ocs-storagecluster-ceph-rbd
          resources:
            requests:
              storage: 100Gi
      # nodeSelector: { node-role.kubernetes.io/infra: "" }      # if infra nodes exist
      # tolerations: [{ key: node-role.kubernetes.io/infra, operator: Exists, effect: NoSchedule }]
      # remoteWrite:                                              # optional long-term store
      #   - url: https://thanos-receive.<domain>/api/v1/receive
    alertmanagerMain:
      enableUserAlertmanagerConfig: true
      volumeClaimTemplate:
        spec:
          storageClassName: ocs-storagecluster-ceph-rbd
          resources:
            requests:
              storage: 20Gi
    thanosQuerier:
      enableRequestLogging: false
    kubeStateMetrics:
      metricLabelsAllowlist:
        - vms=[app,env,wave]                     # expose VM labels used in §10.2 to PromQL
