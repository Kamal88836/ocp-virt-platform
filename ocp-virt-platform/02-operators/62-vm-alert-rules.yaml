apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vm-platform-rules
  namespace: vm-prod                      # user-workload namespace; one per VM namespace or a shared one
  labels:
    openshift.io/prometheus-rule-evaluation-scope: leaf-prometheus
spec:
  groups:
    - name: vm-prod.rules
      rules:
        - alert: VMNotRunning
          expr: kubevirt_vm_running_status_last_transition_timestamp_seconds > 0 and on(name, namespace) kubevirt_vm_info{status!="Running"}
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "VM {{ $labels.namespace }}/{{ $labels.name }} not running for 10m"
        - alert: VMMemoryPressure
          expr: (kubevirt_vmi_memory_available_bytes / kubevirt_vmi_memory_domain_bytes) < 0.10
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "VM {{ $labels.namespace }}/{{ $labels.name }} has <10% guest memory available"
        - alert: VMGuestAgentDisconnected
          expr: kubevirt_vmi_info{guest_os_kernel_release="<none>"} == 1
          for: 30m
          labels: { severity: info }
          annotations:
            summary: "qemu-guest-agent not reporting for {{ $labels.namespace }}/{{ $labels.name }}"
        - alert: VMLiveMigrationFailed
          expr: increase(kubevirt_vmi_migrations_in_failed_phase[30m]) > 0
          labels: { severity: warning }
          annotations:
            summary: "Live migration failed in {{ $labels.namespace }} in the last 30m"
