apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vlan100
  namespace: vm-prod
  annotations:
    k8s.v1.cni.cncf.io/resourceName: bridge.network.kubevirt.io/br-vlan100
spec:
  config: '{"cniVersion":"0.3.1","name":"vlan100","type":"bridge","bridge":"br-vlan100","macspoofchk":true,"ipam":{}}'
---
# Transfer network for MTV importer pods (needs IPAM; Whereabouts example)
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: migration-transfer
  namespace: openshift-mtv
  annotations:
    k8s.v1.cni.cncf.io/resourceName: bridge.network.kubevirt.io/br-migration
spec:
  config: '{"cniVersion":"0.3.1","name":"migration-transfer","type":"bridge","bridge":"br-migration",
            "ipam":{"type":"whereabouts","range":"10.200.0.0/24","range_start":"10.200.0.100",
            "range_end":"10.200.0.199","gateway":"10.200.0.1"}}'
