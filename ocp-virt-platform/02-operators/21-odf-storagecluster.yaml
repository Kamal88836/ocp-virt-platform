apiVersion: ocs.openshift.io/v1
kind: StorageCluster
metadata:
  name: ocs-storagecluster
  namespace: openshift-storage
spec:
  manageNodes: false
  resources:
    mds: { limits: { cpu: "3", memory: 8Gi }, requests: { cpu: "3", memory: 8Gi } }
  monDataDirHostPath: /var/lib/rook
  storageDeviceSets:
    - name: ocs-deviceset
      count: 1
      replica: 3
      portable: false
      dataPVCTemplate:
        spec:
          storageClassName: localblock
          accessModes: [ReadWriteOnce]
          volumeMode: Block
          resources: { requests: { storage: "1" } }
