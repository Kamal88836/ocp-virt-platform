apiVersion: v1beta1
kind: AgentConfig
metadata:
  name: <cluster>
rendezvousIP: 10.10.20.11                 # IP of master-0; this host coordinates the install
additionalNTPSources:
  - ntp.<domain>
hosts:
  - hostname: master-0
    role: master
    interfaces:
      - name: eno1
        macAddress: 00:11:22:33:44:01
    rootDeviceHints:
      deviceName: /dev/nvme0n1
    networkConfig:
      interfaces:
        - name: eno1
          type: ethernet
          state: up
          mac-address: 00:11:22:33:44:01
          ipv4:
            enabled: true
            dhcp: false
            address:
              - ip: 10.10.20.11
                prefix-length: 24
          ipv6: { enabled: false }
      dns-resolver:
        config:
          server: [10.10.20.2]
          search: [<domain>]
      routes:
        config:
          - destination: 0.0.0.0/0
            next-hop-address: 10.10.20.1
            next-hop-interface: eno1
  # --- repeat for master-1 (10.10.20.12), master-2 (10.10.20.13)
  - hostname: worker-0
    role: worker
    interfaces:
      - name: ens1f0
        macAddress: 00:11:22:33:55:01
      - name: ens1f1
        macAddress: 00:11:22:33:55:02
    rootDeviceHints:
      deviceName: /dev/nvme0n1
    networkConfig:                        # LACP bond + native VLAN for machine network; VM VLANs added later via NNCP (§6.1)
      interfaces:
        - name: bond0
          type: bond
          state: up
          mtu: 9000
          link-aggregation:
            mode: 802.3ad
            options: { miimon: "100", lacp_rate: fast }
            port: [ens1f0, ens1f1]
          ipv4:
            enabled: true
            dhcp: false
            address:
              - ip: 10.10.20.21
                prefix-length: 24
        - name: ens1f0
          type: ethernet
          state: up
          mac-address: 00:11:22:33:55:01
        - name: ens1f1
          type: ethernet
          state: up
          mac-address: 00:11:22:33:55:02
      dns-resolver:
        config:
          server: [10.10.20.2]
      routes:
        config:
          - destination: 0.0.0.0/0
            next-hop-address: 10.10.20.1
            next-hop-interface: bond0
  # --- repeat for worker-1, worker-2
