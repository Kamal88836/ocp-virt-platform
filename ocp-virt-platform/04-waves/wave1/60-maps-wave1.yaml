apiVersion: forklift.konveyor.io/v1beta1
kind: NetworkMap
metadata:
  name: netmap-wave1
  namespace: openshift-mtv
spec:
  provider:
    source:      { name: vsphere-prod, namespace: openshift-mtv }
    destination: { name: host,         namespace: openshift-mtv }
  map:
    - source:      { id: network-1051 }                  # "VM Network VLAN100" (dvportgroup)
      destination: { type: multus, name: vlan100, namespace: vm-prod }
    - source:      { id: network-1052 }                  # mgmt network → pod network
      destination: { type: pod }
---
apiVersion: forklift.konveyor.io/v1beta1
kind: StorageMap
metadata:
  name: stormap-wave1
  namespace: openshift-mtv
spec:
  provider:
    source:      { name: vsphere-prod, namespace: openshift-mtv }
    destination: { name: host,         namespace: openshift-mtv }
  map:
    - source:      { id: datastore-45 }                  # "PROD-SAN-01"
      destination:
        storageClass: ocs-storagecluster-ceph-rbd
        volumeMode: Block
        accessMode: ReadWriteMany
    - source:      { id: datastore-46 }                  # "PROD-NFS-01"
      destination:
        storageClass: ocs-storagecluster-ceph-rbd
        volumeMode: Block
        accessMode: ReadWriteMany
