kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  platform:
    channels:
      - name: stable-4.22
        minVersion: 4.22.1
        maxVersion: 4.22.1
    graph: true                      # enables the OpenShift Update Service graph in disconnected mode
  operators:
    - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.22
      packages:
        - name: kubevirt-hyperconverged
          channels: [ { name: stable } ]
        - name: mtv-operator
          channels: [ { name: release-v2.12 } ]
        - name: kubernetes-nmstate-operator
          channels: [ { name: stable } ]
        - name: local-storage-operator
          channels: [ { name: stable } ]
        - name: odf-operator
          channels: [ { name: stable-4.22 } ]
        - name: ocs-operator
          channels: [ { name: stable-4.22 } ]
        - name: mcg-operator
          channels: [ { name: stable-4.22 } ]
        - name: odf-csi-addons-operator
          channels: [ { name: stable-4.22 } ]
        - name: rook-ceph-operator
          channels: [ { name: stable-4.22 } ]
        - name: cephcsi-operator
          channels: [ { name: stable-4.22 } ]
        - name: ocs-client-operator
          channels: [ { name: stable-4.22 } ]
        - name: odf-prometheus-operator
          channels: [ { name: stable-4.22 } ]
        - name: recipe
          channels: [ { name: stable-4.22 } ]
        - name: node-healthcheck-operator
          channels: [ { name: stable } ]
        - name: self-node-remediation
          channels: [ { name: stable } ]
        - name: fence-agents-remediation
          channels: [ { name: stable } ]
        - name: redhat-oadp-operator
          channels: [ { name: stable-1.5 } ]
        - name: metallb-operator
          channels: [ { name: stable } ]
        - name: cluster-kube-descheduler-operator
          channels: [ { name: stable } ]
  additionalImages:
    - name: registry.access.redhat.com/ubi9/ubi-minimal:latest              # VDDK image base (§7.3)
    - name: registry.redhat.io/rhel9/rhel-guest-image:9.6                   # golden boot images (§3.7)
    - name: registry.redhat.io/rhel8/rhel-guest-image:8.10
    - name: registry.redhat.io/container-native-virtualization/cnv-must-gather-rhel9:v4.22
    - name: registry.redhat.io/migration-toolkit-virtualization/mtv-must-gather-rhel9:2.12
    - name: registry.redhat.io/openshift4/ose-must-gather:latest
