apiVersion: v1
kind: Secret
metadata:
  name: vsphere-prod-secret
  namespace: openshift-mtv
  labels:
    createdForProviderType: vsphere
    createdForResourceType: providers
type: Opaque
stringData:
  user: svc-mtv@vsphere.local
  password: '<PASSWORD>'
  url: https://vcenter.<domain>/sdk
  insecureSkipVerify: "false"
  cacert: |
    -----BEGIN CERTIFICATE-----
    <paste vCenter CA chain, indented 4 spaces>
    -----END CERTIFICATE-----
---
apiVersion: forklift.konveyor.io/v1beta1
kind: Provider
metadata:
  name: vsphere-prod
  namespace: openshift-mtv
spec:
  type: vsphere
  url: https://vcenter.<domain>/sdk
  secret:
    name: vsphere-prod-secret
    namespace: openshift-mtv
  settings:
    sdkEndpoint: vcenter                 # or: esxi  (url then points at the ESXi host /sdk)
    vddkInitImage: image-registry.openshift-image-registry.svc:5000/openshift-mtv/vddk:8.0.3
    useVddkAioOptimization: "true"
    vddkConfig: |
      VixDiskLib.nfcAio.Session.BufSizeIn64KB=16
      VixDiskLib.nfcAio.Session.BufCount=4
