apiVersion: v1
kind: Secret
metadata:
  name: esxi01-secret
  namespace: openshift-mtv
  labels:
    createdForResourceType: hosts
type: Opaque
stringData:
  user: root
  password: '<ESXI_PASSWORD>'
  insecureSkipVerify: "true"
---
apiVersion: forklift.konveyor.io/v1beta1
kind: Host
metadata:
  name: esxi01-migration
  namespace: openshift-mtv
spec:
  id: host-21                         # from inventory: /providers/vsphere/<uid>/hosts
  ipAddress: 10.200.0.11              # vmkernel IP on migration VLAN 200
  provider:
    name: vsphere-prod
    namespace: openshift-mtv
  secret:
    name: esxi01-secret
    namespace: openshift-mtv
