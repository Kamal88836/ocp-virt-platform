apiVersion: metallb.io/v1beta1
kind: MetalLB
metadata: { name: metallb, namespace: metallb-system }
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata: { name: vm-services, namespace: metallb-system }
spec:
  addresses: [10.10.50.100-10.10.50.150]
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata: { name: vm-services-l2, namespace: metallb-system }
spec:
  ipAddressPools: [vm-services]
