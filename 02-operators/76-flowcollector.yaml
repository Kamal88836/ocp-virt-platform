apiVersion: flows.netobserv.io/v1beta2
kind: FlowCollector
metadata:
  name: cluster
spec:
  namespace: netobserv
  deploymentModel: Direct
  agent:
    type: eBPF
    ebpf:
      sampling: 50                        # 1 = every packet (high CPU); 50 is a production default
      privileged: true                    # required to see VM secondary-network (bridge) traffic
      features: [PacketDrop, DNSTracking]
      resources:
        requests: { cpu: 100m, memory: 200Mi }
        limits:   { memory: 800Mi }
  processor:
    logTypes: Flows
    metrics:
      includeList: [node_ingress_bytes_total, workload_ingress_bytes_total, namespace_flows_total,
                    namespace_drop_packets_total, namespace_dns_latency_seconds]
  loki:
    enable: false                         # Prometheus-only; set true + lokiStack{} for per-flow retention
  prometheus:
    querier:
      enable: true
      mode: Auto
  consolePlugin:
    enable: true
    portNaming:
      enable: true
