apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: vm-bridges
spec:
  nodeSelector:
    node-role.kubernetes.io/virtualization: ""
  maxUnavailable: 1
  desiredState:
    interfaces:
      - name: bond1
        type: bond
        state: up
        ipv4: { enabled: false }
        ipv6: { enabled: false }
        link-aggregation:
          mode: 802.3ad
          options: { miimon: "100", lacp_rate: fast, xmit_hash_policy: layer3+4 }
          port: [ens1f0, ens1f1]            # <-- client NIC names (oc get nns <node> -o yaml)
        mtu: 9000
      - name: bond1.100
        type: vlan
        state: up
        vlan: { base-iface: bond1, id: 100 }
        ipv4: { enabled: false }
        ipv6: { enabled: false }
      - name: br-vlan100                     # VM production VLAN 100
        type: linux-bridge
        state: up
        ipv4: { enabled: false }
        ipv6: { enabled: false }
        bridge:
          options: { stp: { enabled: false } }
          port: [ { name: bond1.100 } ]
      - name: bond1.200
        type: vlan
        state: up
        vlan: { base-iface: bond1, id: 200 }
        ipv4: { enabled: false }
        ipv6: { enabled: false }
      - name: br-migration                   # ESXi ↔ OCP transfer network VLAN 200
        type: linux-bridge
        state: up
        ipv4: { enabled: false }
        ipv6: { enabled: false }
        bridge:
          options: { stp: { enabled: false } }
          port: [ { name: bond1.200 } ]
